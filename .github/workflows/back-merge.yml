name: Back-merge main → develop
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write

jobs:
  back-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create back-merge PR
        run: |
          # Check if main has commits not in develop
          if git diff --quiet origin/develop..origin/main; then
            echo "No changes to back-merge"
            exit 0
          fi

          # Check if a back-merge PR already exists
          EXISTING=$(gh pr list --base develop --head main --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Back-merge PR #${EXISTING} already exists"
            exit 0
          fi

          gh pr create --base develop --head main \
            --title "chore: Back-merge main into develop" \
            --body "Automated back-merge of main into develop after release."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
