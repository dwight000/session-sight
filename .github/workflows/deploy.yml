name: Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/SessionSight.Api/**'
      - 'src/SessionSight.Web/**'
      - 'src/SessionSight.Core/**'
      - 'src/SessionSight.Agents/**'
      - 'src/SessionSight.Infrastructure/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        type: choice
        options:
          - dev
          - stage
        default: dev
      rollback_tag:
        description: 'Image tag to roll back to (e.g. abc1234). Leave empty for normal deploy.'
        type: string
        default: ''

jobs:
  build-and-push:
    name: Build and Push Images
    if: github.event.inputs.rollback_tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "version=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SessionSight.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sessionsight-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sessionsight-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/SessionSight.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sessionsight-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/sessionsight-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Dev
    needs: build-and-push
    if: github.event.inputs.rollback_tag == '' && github.event.inputs.environment != 'stage'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API Container App
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          RG="rg-sessionsight-dev"
          az containerapp update \
            --resource-group ${RG} \
            --name sessionsight-dev-api \
            --image ghcr.io/${{ github.repository_owner }}/sessionsight-api:${TAG}

      - name: Update Web Container App
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          RG="rg-sessionsight-dev"
          az containerapp update \
            --resource-group ${RG} \
            --name sessionsight-dev-web \
            --image ghcr.io/${{ github.repository_owner }}/sessionsight-web:${TAG}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore NuGet packages
        run: dotnet restore src/SessionSight.Api/SessionSight.Api.csproj

      - name: Run EF Migrations
        run: |
          dotnet ef database update \
            --project src/SessionSight.Infrastructure \
            --startup-project src/SessionSight.Api \
            --connection "Server=sessionsight-sql-dev.database.windows.net;Database=sessionsight;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"

      - name: Get deployment URLs
        run: |
          RG="rg-sessionsight-dev"
          API_URL=$(az containerapp show -g ${RG} -n sessionsight-dev-api --query properties.configuration.ingress.fqdn -o tsv)
          WEB_URL=$(az containerapp show -g ${RG} -n sessionsight-dev-web --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Dev Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: https://${WEB_URL}" >> $GITHUB_STEP_SUMMARY

  deploy-stage:
    name: Deploy to Stage
    needs: build-and-push
    if: github.event.inputs.rollback_tag == '' && (github.event.inputs.environment == 'stage' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment: stage
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API Container App
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          RG="rg-sessionsight-dev"
          az containerapp update \
            --resource-group ${RG} \
            --name sessionsight-stage-api \
            --image ghcr.io/${{ github.repository_owner }}/sessionsight-api:${TAG}

      - name: Update Web Container App
        run: |
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          RG="rg-sessionsight-dev"
          az containerapp update \
            --resource-group ${RG} \
            --name sessionsight-stage-web \
            --image ghcr.io/${{ github.repository_owner }}/sessionsight-web:${TAG}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Restore NuGet packages
        run: dotnet restore src/SessionSight.Api/SessionSight.Api.csproj

      - name: Run EF Migrations
        run: |
          dotnet ef database update \
            --project src/SessionSight.Infrastructure \
            --startup-project src/SessionSight.Api \
            --connection "Server=sessionsight-sql-dev.database.windows.net;Database=sessionsight-stage;Authentication=Active Directory Default;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;"

      - name: Get deployment URLs
        run: |
          RG="rg-sessionsight-dev"
          API_URL=$(az containerapp show -g ${RG} -n sessionsight-stage-api --query properties.configuration.ingress.fqdn -o tsv)
          WEB_URL=$(az containerapp show -g ${RG} -n sessionsight-stage-web --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Stage Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: https://${WEB_URL}" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback
    if: github.event.inputs.rollback_tag != ''
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment || 'dev' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update API Container App
        run: |
          ENV=${{ github.event.inputs.environment || 'dev' }}
          TAG=${{ github.event.inputs.rollback_tag }}
          RG="rg-sessionsight-dev"
          az containerapp update \
            --resource-group ${RG} \
            --name sessionsight-${ENV}-api \
            --image ghcr.io/${{ github.repository_owner }}/sessionsight-api:${TAG}

      - name: Update Web Container App
        run: |
          ENV=${{ github.event.inputs.environment || 'dev' }}
          TAG=${{ github.event.inputs.rollback_tag }}
          RG="rg-sessionsight-dev"
          az containerapp update \
            --resource-group ${RG} \
            --name sessionsight-${ENV}-web \
            --image ghcr.io/${{ github.repository_owner }}/sessionsight-web:${TAG}

      - name: Rollback Summary
        run: |
          ENV=${{ github.event.inputs.environment || 'dev' }}
          TAG=${{ github.event.inputs.rollback_tag }}
          RG="rg-sessionsight-dev"
          API_URL=$(az containerapp show -g ${RG} -n sessionsight-${ENV}-api --query properties.configuration.ingress.fqdn -o tsv)
          WEB_URL=$(az containerapp show -g ${RG} -n sessionsight-${ENV}-web --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Rollback Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${ENV}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rolled back to tag:** ${TAG}" >> $GITHUB_STEP_SUMMARY
          echo "- API: https://${API_URL}" >> $GITHUB_STEP_SUMMARY
          echo "- Web: https://${WEB_URL}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Note:** EF migrations are NOT reversed by rollback. If the rollback" >> $GITHUB_STEP_SUMMARY
          echo "> target predates a destructive migration, manual database work may be needed." >> $GITHUB_STEP_SUMMARY
